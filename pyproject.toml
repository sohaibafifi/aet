[project]
name = "aet"
version = "0.2.0"
description = "Amortized Efficiency Threshold (AET): energy framework for neural-vs-heuristic CO solvers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Sohaib Afifi", email = "sohaib.afifi@univ-artois.fr" },
]
keywords = [
    "combinatorial-optimization",
    "neural-co-solvers",
    "green-ai",
    "energy-accounting",
    "carbon-footprint",
    "vehicle-routing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    # Core training stack
    "hydra-core>=1.3",
    "lightning==2.6.1",
    "omegaconf>=2.3.0",
    "pyrootutils>=1.0.4",
    "rl4co>=0.6.0",
    "torch==2.8.0",
    "tqdm",

    # Energy + carbon accounting
    "codecarbon>=2.5.0",
    "nvidia-ml-py>=12.535.108",
    "pyRAPL>=0.2.3; sys_platform == 'linux'",

    # HGS baseline
    "pyvrp>0.10,<0.11.4",
    "pebble",

    # Plotting + post-hoc analysis
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/sohaibafifi/aet"
Paper    = "https://arxiv.org/abs/2605.14624"
Issues   = "https://github.com/sohaibafifi/aet/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aet", "cvrp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]
ignore = ["E501"]
